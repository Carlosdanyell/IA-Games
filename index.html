<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#0d0915">
<meta name="description" content="Biblioteca de jogos offline em HTML. Leves, sem instalação e feitos para o celular.">
<title>IA Games · Biblioteca offline</title>
<link rel="manifest" href="./manifest.webmanifest">
<link rel="icon" type="image/svg+xml" href="./assets/icon.svg">
<link rel="apple-touch-icon" href="./assets/icon.svg">
<link rel="stylesheet" href="./core/shell.css">
<style>
  body{min-height:100dvh}
  .library{width:min(100%,760px);margin:0 auto;padding:calc(20px + env(safe-area-inset-top)) 18px calc(28px + env(safe-area-inset-bottom));
    display:flex;flex-direction:column;gap:20px}
  .lib-head{display:flex;justify-content:space-between;align-items:flex-start;gap:12px}
  .lib-head h1{font-size:1.45rem;font-weight:850;letter-spacing:-.02em;margin:0;line-height:1.1}
  .lib-head h1 span{color:var(--accent)}
  .lib-head p{margin:7px 0 0;color:var(--muted);font-size:.88rem;line-height:1.45;max-width:44ch}
  .badge-row{display:flex;gap:7px;flex-wrap:wrap;margin-top:12px}
  .badge{font:500 .72rem ui-monospace,monospace;border:1px solid var(--line);border-radius:7px;padding:4px 8px;color:var(--muted)}
  .badge[data-on="1"]{border-color:var(--accent);color:var(--accent)}
  button.badge{background:none;cursor:pointer;font-family:ui-monospace,monospace}
  button.badge:active{border-color:var(--accent);color:var(--accent)}
  .grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(230px,1fr));gap:14px}
  .card{display:flex;flex-direction:column;border:1px solid var(--line);border-radius:18px;background:var(--surface);
    overflow:hidden;transition:transform .12s,border-color .12s}
  .card:active{transform:scale(.985)}
  .card:hover{border-color:var(--accent)}
  .card[aria-disabled="true"]{opacity:.55;pointer-events:none}
  .cover{aspect-ratio:16/10;background:var(--arena);border-bottom:1px solid var(--line);position:relative;overflow:hidden}
  .cover svg{width:100%;height:100%;stroke:none}
  .cover img{display:block;width:100%;height:100%;object-fit:cover}
  .card-body{padding:14px 15px 16px}
  .card-body h2{margin:0;font-size:1.02rem;font-weight:750;letter-spacing:-.01em}
  .card-body p{margin:6px 0 0;font-size:.82rem;line-height:1.4;color:var(--muted)}
  .tags{display:flex;gap:6px;flex-wrap:wrap;margin-top:11px}
  .tag{font:500 .68rem ui-monospace,monospace;border:1px solid var(--line);border-radius:6px;padding:3px 6px;color:var(--muted)}
  .soon{border-style:dashed;display:grid;place-items:center;min-height:190px;color:var(--muted);
    text-align:center;padding:22px;font-size:.84rem;line-height:1.5}
  .lib-foot{color:var(--muted);font-size:.78rem;line-height:1.55;border-top:1px solid var(--line);
    padding-top:16px;text-align:center}
  .lib-foot strong{color:var(--text);font-weight:650}
</style>
</head>
<body>
<main class="library">
  <header class="lib-head">
    <div>
      <h1>IA <span>GAMES</span></h1>
      <p>Biblioteca de jogos em HTML que funcionam sem internet. Abra uma vez e continue jogando offline.</p>
      <div class="badge-row">
        <span class="badge" id="offlineBadge">Verificando cache…</span>
        <span class="badge" id="installBadge" hidden>Instalável na tela inicial</span>
        <button class="badge" id="buildBadge" type="button" title="Toque para buscar a versão mais nova">build …</button>
      </div>
    </div>
    <button class="icon-button" id="themeButton" aria-label="Alternar tema" title="Alternar tema">
      <svg viewBox="0 0 24 24" id="themeIcon"></svg>
    </button>
  </header>

  <section class="grid" id="grid" aria-label="Jogos disponíveis"></section>

  <footer class="lib-foot">
    by <strong>Carlos Danyell</strong>
  </footer>
</main>

<script type="module">
  import { GAMES } from './core/registry.js';
  import { createStore } from './core/storage.js';
  import { createTheme } from './core/theme.js';

  const store = createStore('app');
  const SUN = '<circle cx="12" cy="12" r="4"/><path d="M12 2v2m0 16v2M2 12h2m16 0h2M5 5l1.5 1.5m11 11L19 19M5 19l1.5-1.5m11-11L19 5"/>';
  const MOON = '<path d="M20 15a9 9 0 0 1-11-11 9 9 0 1 0 11 11z"/>';
  const icon = document.getElementById('themeIcon');
  const theme = createTheme(store, { onChange: (t, mode) => { icon.innerHTML = mode === 'dark' ? SUN : MOON; } });
  document.getElementById('themeButton').addEventListener('click', () => theme.toggleMode());

  const covers = {
    snake: `<svg viewBox="0 0 320 200" aria-hidden="true">
      <defs>
        <radialGradient id="snakeAura" cx="48%" cy="54%" r="63%">
          <stop stop-color="#233723"/><stop offset="1" stop-color="#0a1013"/>
        </radialGradient>
        <linearGradient id="snakeBody" x1="0" y1="1" x2="1" y2="0">
          <stop stop-color="#56c86b"/><stop offset=".65" stop-color="#b9ff66"/><stop offset="1" stop-color="#dfff9d"/>
        </linearGradient>
        <pattern id="snakeGrid" width="20" height="20" patternUnits="userSpaceOnUse">
          <path d="M20 0H0V20" fill="none" stroke="#b9ff66" stroke-width=".5" opacity=".1"/>
        </pattern>
      </defs>
      <rect width="320" height="200" fill="url(#snakeAura)"/>
      <rect x="20" y="20" width="280" height="160" rx="10" fill="url(#snakeGrid)"/>
      <path d="M20 44V20h24M276 20h24v24M300 156v24h-24M44 180H20v-24" fill="none" stroke="#b9ff66" stroke-width="1" opacity=".3"/>
      <path d="M64 145h70a19 19 0 0 0 19-19v-1a19 19 0 0 0-19-19H99a21 21 0 0 1-21-21v-4a21 21 0 0 1 21-21h98a20 20 0 0 1 20 20v20" fill="none" stroke="#b9ff66" stroke-width="31" stroke-linejoin="round" stroke-linecap="round" opacity=".07"/>
      <path d="M64 145h70a19 19 0 0 0 19-19v-1a19 19 0 0 0-19-19H99a21 21 0 0 1-21-21v-4a21 21 0 0 1 21-21h98a20 20 0 0 1 20 20v20" fill="none" stroke="url(#snakeBody)" stroke-width="17" stroke-linejoin="round" stroke-linecap="round"/>
      <path d="M76 141h49M97 56h90" fill="none" stroke="#f0ffd6" stroke-width="2" stroke-linecap="round" opacity=".48"/>
      <rect x="205" y="87" width="24" height="29" rx="10" fill="#d2ff88"/>
      <g fill="#122418"><ellipse cx="211" cy="105" rx="2.3" ry="3.4"/><ellipse cx="223" cy="105" rx="2.3" ry="3.4"/></g>
      <path d="M217 116v6m0-1-3 3m3-3 3 3" fill="none" stroke="#ff8c87" stroke-width="1.5" stroke-linecap="round"/>
      <circle cx="217" cy="151" r="19" fill="#ff7e86" opacity=".07"/>
      <circle cx="217" cy="151" r="12" fill="none" stroke="#ff7e86" stroke-width=".8" opacity=".4"/>
      <path d="m217 143 7 8-7 8-7-8z" fill="#ff858b"/>
      <path d="m217 145 4 5-4-1z" fill="#ffd2d4"/>
      <g fill="#b9ff66" opacity=".5"><circle cx="259" cy="58" r="1.5"/><circle cx="43" cy="105" r="1"/><circle cx="175" cy="167" r="1"/></g>
      <g fill="#ff858b"><circle cx="245" cy="139" r="1.5"/><circle cx="202" cy="169" r="1"/></g>
    </svg>`,
    neon: `<svg viewBox="0 0 320 200" aria-hidden="true">
      <rect width="320" height="200" fill="none"/>
      ${[0,1,2].map(r => [0,1,2,3,4,5].map(c =>
        `<rect x="${28 + c*44}" y="${34 + r*26}" width="36" height="17" rx="4"
           fill="currentColor" opacity="${0.85 - r*0.18}"/>`).join('')).join('')}
      <circle cx="196" cy="136" r="7" fill="currentColor"/>
      <rect x="120" y="162" width="80" height="9" rx="4.5" fill="currentColor"/>
    </svg>`
    ,
    words: `<svg viewBox="0 0 320 200" aria-hidden="true">
      ${[[0,0],[1,0],[2,0],[3,0],[1,1],[1,2],[0,3],[1,3],[2,3],[3,3],[4,3],[3,1],[3,2],[3,4]]
        .map(([c,r]) => `<rect x="${34 + c*30}" y="${28 + r*30}" width="26" height="26" rx="5"
             fill="currentColor" opacity="${r === 0 || c === 1 ? 0.85 : 0.4}"/>`).join('')}
      <circle cx="242" cy="112" r="46" fill="none" stroke="currentColor" stroke-width="2" opacity=".35"/>
      ${[0,1,2,3,4].map(i => {
        const a = i * Math.PI * 2 / 5 - Math.PI / 2;
        return `<circle cx="${242 + Math.cos(a)*32}" cy="${112 + Math.sin(a)*32}" r="11" fill="currentColor" opacity="${i < 3 ? 0.9 : 0.45}"/>`;
      }).join('')}
      <path d="M${242 + Math.cos(-Math.PI/2)*32} ${112 + Math.sin(-Math.PI/2)*32}
               L${242 + Math.cos(Math.PI*2/5 - Math.PI/2)*32} ${112 + Math.sin(Math.PI*2/5 - Math.PI/2)*32}
               L${242 + Math.cos(Math.PI*4/5 - Math.PI/2)*32} ${112 + Math.sin(Math.PI*4/5 - Math.PI/2)*32}"
            fill="none" stroke="currentColor" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/>
    </svg>`,
    drop: `<svg viewBox="0 0 320 200" aria-hidden="true">
      <!-- peça caindo na coluna escolhida -->
      <circle cx="216" cy="24" r="13" fill="currentColor"/>
      <circle cx="216" cy="24" r="7" fill="#0000" stroke="currentColor" stroke-width="2" opacity=".5"/>
      <line x1="216" y1="42" x2="216" y2="58" stroke="currentColor" stroke-width="2.5"
        stroke-dasharray="4 6" stroke-linecap="round" opacity=".5"/>
      <!-- quadro com furos -->
      <rect x="52" y="56" width="216" height="132" rx="16" fill="currentColor" opacity=".16"/>
      <rect x="52" y="56" width="216" height="132" rx="16" fill="none" stroke="currentColor"
        stroke-width="2.5" opacity=".7"/>
      ${[0,1,2,3].map(row => [0,1,2,3,4,5].map(col => {
        const x = 68 + col * 37, y = 72 + row * 33;
        // A diagonal 3-1 / 2-2 / 1-3 / 0-4 é a linha vencedora desenhada abaixo.
        const peca = { '3-1': 1, '2-2': 1, '1-3': 1, '0-4': 1,
                       '3-2': 2, '3-3': 2, '3-4': 2, '2-3': 2, '2-4': 2, '1-4': 2 }[row + '-' + col];
        if (peca === 1) return `<circle cx="${x}" cy="${y}" r="13" fill="currentColor"/>`;
        if (peca === 2) return `<circle cx="${x}" cy="${y}" r="13" fill="#5fd5ff"/>`;
        return `<circle cx="${x}" cy="${y}" r="13" fill="#0d0915" opacity=".55"/>`;
      }).join('')).join('')}
      <!-- linha vencedora na diagonal -->
      <line x1="105" y1="171" x2="216" y2="72" stroke="currentColor" stroke-width="5"
        stroke-linecap="round" opacity=".85"/>
    </svg>`,
    grid: `<img src="./assets/covers/neon-grid.svg" width="640" height="400" alt="" loading="lazy" decoding="async">`,
    arrow: `<img src="./assets/covers/neon-arrow.svg" width="640" height="400" alt="" loading="lazy" decoding="async">`,
    pool: `<svg viewBox="0 0 320 200" aria-hidden="true">
      <rect x="24" y="28" width="272" height="144" rx="18" fill="none" stroke="currentColor" stroke-width="3" opacity=".45"/>
      ${[[24,28],[160,28],[296,28],[24,172],[160,172],[296,172]]
        .map(([x,y]) => `<circle cx="${x}" cy="${y}" r="10" fill="currentColor" opacity=".3"/>`).join('')}
      ${[0,1,2,3].map(row => [...Array(row+1)].map((_, i) =>
        `<circle cx="${196 + row*17}" cy="${100 + (i - row/2)*19}" r="9" fill="currentColor"
           opacity="${0.95 - row*0.13}"/>`).join('')).join('')}
      <circle cx="96" cy="100" r="9" fill="currentColor" opacity=".55"/>
      <line x1="36" y1="100" x2="84" y2="100" stroke="currentColor" stroke-width="4"
        stroke-linecap="round" opacity=".8"/>
    </svg>`,
    shooter: `<svg viewBox="0 0 320 200" aria-hidden="true">
      <g fill="#dff6ff" opacity=".45">
        <circle cx="30" cy="24" r="1.4"/><circle cx="92" cy="62" r="1"/><circle cx="140" cy="16" r="1.2"/>
        <circle cx="206" cy="30" r="1"/><circle cx="292" cy="22" r="1.5"/><circle cx="270" cy="104" r="1"/>
        <circle cx="44" cy="122" r="1.2"/><circle cx="112" cy="150" r="1"/><circle cx="300" cy="146" r="1.2"/>
      </g>
      <!-- grade em perspectiva -->
      <g stroke="currentColor" stroke-width="1.2" opacity=".2" fill="none">
        <path d="M0 176h320M0 188h320"/>
        <path d="M160 164 40 200M160 164 104 200M160 164 216 200M160 164 280 200"/>
      </g>
      <!-- formação inimiga -->
      ${[[70,50],[160,36],[250,50]].map(([x,y]) =>
        `<path d="M${x} ${y + 14}l16-22-16 7-16-7z" fill="currentColor"/>`).join('')}
      <path d="M112 90l9-14-9 4-9-4z" fill="currentColor" opacity=".7"/>
      <!-- explosão -->
      <circle cx="226" cy="92" r="16" fill="#ffe45e" opacity=".18"/>
      <g stroke="#ffe45e" stroke-width="3" stroke-linecap="round">
        <path d="M216 82l-7-7M226 78v-11M236 82l7-7M215 100l-9 3M237 100l9 3"/>
      </g>
      <circle cx="226" cy="92" r="6" fill="#ffe45e"/>
      <!-- tiros inimigos -->
      <circle cx="96" cy="120" r="4.5" fill="#ff5a5a"/>
      <circle cx="116" cy="136" r="4.5" fill="#ff5a5a" opacity=".75"/>
      <!-- tiros da nave -->
      <g stroke="#5ff4ff" stroke-width="3.5" stroke-linecap="round">
        <path d="M152 118v-14M168 118v-14M152 88v-12M168 88v-12M160 62v-10"/>
      </g>
      <!-- nave -->
      <path d="M160 128l9 20 14 12v6l-14-4-4 6h-10l-4-6-14 4v-6l14-12z" fill="#0d0915"
        stroke="#5ff4ff" stroke-width="3" stroke-linejoin="round"/>
      <path d="M154 172l6 14 6-14z" fill="currentColor" opacity=".9"/>
    </svg>`,
    slither: `<img src="./assets/covers/neon-slither.svg" width="640" height="400" alt="" loading="lazy" decoding="async">`,
    memo: `<img src="./assets/covers/neon-memo.svg" width="640" height="400" alt="" loading="lazy" decoding="async">`,
    chess: `<img src="./assets/covers/neon-chess.svg" width="640" height="400" alt="" loading="lazy" decoding="async">`
  };

  const grid = document.getElementById('grid');
  grid.innerHTML = GAMES.map(g => `
    <a class="card" href="./play.html?game=${encodeURIComponent(g.id)}"${g.status !== 'ready' ? ' aria-disabled="true"' : ''}>
      <div class="cover" style="color:${g.accent}">${covers[g.art] || ''}</div>
      <div class="card-body">
        <h2>${g.title}</h2>
        <p>${g.tagline}</p>
        <div class="tags">${g.tags.map(t => `<span class="tag">${t}</span>`).join('')}</div>
      </div>
    </a>`).join('') +
    `<div class="card soon"><div>Próximo título<br><span style="opacity:.7">o shell já está pronto para receber</span></div></div>`;

  const offlineBadge = document.getElementById('offlineBadge');
  const buildBadge = document.getElementById('buildBadge');

  // Pergunta ao service worker ativo qual build está servindo os arquivos.
  function showBuild() {
    const sw = navigator.serviceWorker && navigator.serviceWorker.controller;
    if (!sw) { buildBadge.textContent = 'build: rede'; return; }
    const channel = new MessageChannel();
    channel.port1.onmessage = e => {
      const v = e.data && e.data.version;
      if (v) buildBadge.textContent = 'build ' + String(v).replace('ia-games-', '');
    };
    sw.postMessage({ type: 'VERSION' }, [channel.port2]);
  }

  // Um build novo instala mas fica em "waiting" enquanto o worker antigo ainda
  // está ocupado atendendo a página — e o navegador não tenta de novo sozinho.
  // Daí a insistência: pede SKIP_WAITING a cada 1,5s até a troca acontecer.
  function promote(reg) {
    let tries = 0;
    const tick = () => {
      if (tries++ > 16) return;
      if (reg.waiting) {
        reg.waiting.postMessage({ type: 'SKIP_WAITING' });
        // Só o SKIP_WAITING não basta: o navegador só reavalia a troca em certos
        // momentos, e uma checagem de update é um deles.
        reg.update().catch(() => {});
      }
      // Segue observando enquanto houver build novo instalando ou esperando:
      // o updatefound pode ter acontecido antes desta página existir.
      if (reg.waiting || reg.installing) setTimeout(tick, 1500);
    };
    tick();
  }

  function nudge(reg) {
    promote(reg);
    reg.addEventListener('updatefound', () => {
      promote(reg);
      const sw = reg.installing;
      if (sw) sw.addEventListener('statechange', () => {
        if (sw.state === 'activated') ready();
      });
    });
  }

  function ready() {
    offlineBadge.textContent = 'Disponível offline';
    offlineBadge.dataset.on = '1';
    showBuild();
  }

  if ('serviceWorker' in navigator) {
    const hadController = !!navigator.serviceWorker.controller;
    let reloading = false;
    // Se o usuário já está saindo da página (tocou num jogo) ou o app está em
    // segundo plano, o reload seria só atrapalhar: a próxima navegação já pega
    // os arquivos novos.
    let leaving = false;
    document.addEventListener('click', e => {
      if (e.target.closest && e.target.closest('a')) leaving = true;
    }, true);
    window.addEventListener('pagehide', () => { leaving = true; });
    navigator.serviceWorker.addEventListener('controllerchange', () => {
      if (!hadController || reloading || leaving || document.visibilityState !== 'visible') {
        showBuild();
        return;
      }
      reloading = true;
      location.reload();
    });

    navigator.serviceWorker.register('./sw.js', { updateViaCache: 'none' })
      .then(reg => {
        if (navigator.serviceWorker.controller) ready();
        nudge(reg);

        // Procura build novo ao abrir e sempre que o app volta ao primeiro plano
        // (no PWA instalado não há navegação para disparar a checagem sozinha).
        let lastCheck = 0;
        const check = () => {
          const now = Date.now();
          if (now - lastCheck < 30000) return;
          lastCheck = now;
          reg.update().catch(() => {});
        };
        check();
        document.addEventListener('visibilitychange', () => {
          if (document.visibilityState === 'visible') check();
        });
        buildBadge.addEventListener('click', () => {
          buildBadge.textContent = 'buscando…';
          lastCheck = 0;
          reg.update()
            .then(() => new Promise(r => setTimeout(r, 900)))
            .then(() => location.reload())
            .catch(() => location.reload());
        });
      })
      .catch(() => {
        offlineBadge.textContent = 'Offline indisponível neste contexto';
        buildBadge.textContent = 'build: rede';
      });
  } else {
    offlineBadge.textContent = 'Navegador sem suporte a offline';
    buildBadge.hidden = true;
  }
  window.addEventListener('beforeinstallprompt', () => {
    document.getElementById('installBadge').hidden = false;
  });
</script>
</body>
</html>
