<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#0d0915">
<meta name="description" content="Biblioteca de jogos offline em HTML. Leves, sem instalação e feitos para o celular.">
<title>IA Games · Biblioteca offline</title>
<link rel="manifest" href="./manifest.webmanifest">
<link rel="icon" type="image/svg+xml" href="./assets/icon.svg">
<link rel="apple-touch-icon" href="./assets/icon.svg">
<link rel="stylesheet" href="./core/shell.css">
<style>
  body{min-height:100dvh}
  .library{width:min(100%,760px);margin:0 auto;padding:calc(20px + env(safe-area-inset-top)) 18px calc(28px + env(safe-area-inset-bottom));
    display:flex;flex-direction:column;gap:20px}
  .lib-head{display:flex;justify-content:space-between;align-items:flex-start;gap:12px}
  .lib-head h1{font-size:1.45rem;font-weight:850;letter-spacing:-.02em;margin:0;line-height:1.1}
  .lib-head h1 span{color:var(--accent)}
  .lib-head p{margin:7px 0 0;color:var(--muted);font-size:.88rem;line-height:1.45;max-width:44ch}
  .badge-row{display:flex;gap:7px;flex-wrap:wrap;margin-top:12px}
  .badge{font:500 .72rem ui-monospace,monospace;border:1px solid var(--line);border-radius:7px;padding:4px 8px;color:var(--muted)}
  .badge[data-on="1"]{border-color:var(--accent);color:var(--accent)}
  button.badge{background:none;cursor:pointer;font-family:ui-monospace,monospace}
  button.badge:active{border-color:var(--accent);color:var(--accent)}
  .grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(230px,1fr));gap:14px}
  .card{display:flex;flex-direction:column;border:1px solid var(--line);border-radius:18px;background:var(--surface);
    overflow:hidden;transition:transform .12s,border-color .12s}
  .card:active{transform:scale(.985)}
  .card:hover{border-color:var(--accent)}
  .card[aria-disabled="true"]{opacity:.55;pointer-events:none}
  .cover{aspect-ratio:16/10;background:var(--arena);border-bottom:1px solid var(--line);position:relative;overflow:hidden}
  .cover svg{width:100%;height:100%;stroke:none}
  .card-body{padding:14px 15px 16px}
  .card-body h2{margin:0;font-size:1.02rem;font-weight:750;letter-spacing:-.01em}
  .card-body p{margin:6px 0 0;font-size:.82rem;line-height:1.4;color:var(--muted)}
  .tags{display:flex;gap:6px;flex-wrap:wrap;margin-top:11px}
  .tag{font:500 .68rem ui-monospace,monospace;border:1px solid var(--line);border-radius:6px;padding:3px 6px;color:var(--muted)}
  .soon{border-style:dashed;display:grid;place-items:center;min-height:190px;color:var(--muted);
    text-align:center;padding:22px;font-size:.84rem;line-height:1.5}
  .lib-foot{color:var(--muted);font-size:.78rem;line-height:1.55;border-top:1px solid var(--line);
    padding-top:16px;text-align:center}
  .lib-foot strong{color:var(--text);font-weight:650}
</style>
</head>
<body>
<main class="library">
  <header class="lib-head">
    <div>
      <h1>IA <span>GAMES</span></h1>
      <p>Biblioteca de jogos em HTML que funcionam sem internet. Abra uma vez e continue jogando offline.</p>
      <div class="badge-row">
        <span class="badge" id="offlineBadge">Verificando cache…</span>
        <span class="badge" id="installBadge" hidden>Instalável na tela inicial</span>
        <button class="badge" id="buildBadge" type="button" title="Toque para buscar a versão mais nova">build …</button>
      </div>
    </div>
    <button class="icon-button" id="themeButton" aria-label="Alternar tema" title="Alternar tema">
      <svg viewBox="0 0 24 24" id="themeIcon"></svg>
    </button>
  </header>

  <section class="grid" id="grid" aria-label="Jogos disponíveis"></section>

  <footer class="lib-foot">
    by <strong>Carlos Danyell</strong>
  </footer>
</main>

  // Pergunta ao service worker ativo qual build está servindo os arquivos.
  function showBuild() {
    const sw = navigator.serviceWorker && navigator.serviceWorker.controller;
    if (!sw) { buildBadge.textContent = 'build: rede'; return; }
    const channel = new MessageChannel();
    channel.port1.onmessage = e => {
      const v = e.data && e.data.version;
      if (v) buildBadge.textContent = 'build ' + String(v).replace('ia-games-', '');
    };
    sw.postMessage({ type: 'VERSION' }, [channel.port2]);
  }

  // Um build novo instala mas fica em "waiting" enquanto o worker antigo ainda

  function promote(reg) {
    let tries = 0;
    const tick = () => {
      if (tries++ > 16) return;
      if (reg.waiting) {
        reg.waiting.postMessage({ type: 'SKIP_WAITING' });

        // momentos, e uma checagem de update é um deles.
        reg.update().catch(() => {});

      // o updatefound pode ter acontecido antes desta página existir.
      if (reg.waiting || reg.installing) setTimeout(tick, 1500);
    };
    tick();
  }

  function nudge(reg) {
    promote(reg);
    reg.addEventListener('updatefound', () => {
      promote(reg);
      const sw = reg.installing;
      if (sw) sw.addEventListener('statechange', () => {
        if (sw.state === 'activated') ready();

    });
  }

    offlineBadge.textContent = 'Disponível offline';

    // segundo plano, o reload seria só atrapalhar: a próxima navegação já pega
    // os arquivos novos.
    let leaving = false;
    document.addEventListener('click', e => {
      if (e.target.closest && e.target.closest('a')) leaving = true;

    window.addEventListener('pagehide', () => { leaving = true; });
    navigator.serviceWorker.addEventListener('controllerchange', () => {

        let lastCheck = 0;
        const check = () => {
          const now = Date.now();
          if (now - lastCheck < 30000) return;
          lastCheck = now;
          reg.update().catch(() => {});
        };

        document.addEventListener('visibilitychange', () => {
          if (document.visibilityState === 'visible') check();
        });

          buildBadge.textContent = 'buscando…';
          lastCheck = 0;
          reg.update()
            .then(() => new Promise(r => setTimeout(r, 900)))
            .then(() => location.reload())
            .catch(() => location.reload());
        });
      })
      .catch(() => {
        offlineBadge.textContent = 'Offline indisponível neste contexto';
        buildBadge.textContent = 'build: rede';
      });
