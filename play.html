<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#0d0915">
<meta name="description" content="Jogo da biblioteca IA Games. Funciona offline.">
<title>IA Games</title>
<link rel="manifest" href="./manifest.webmanifest">
<link rel="icon" type="image/svg+xml" href="./assets/icon.svg">
<link rel="apple-touch-icon" href="./assets/icon.svg">
<link rel="stylesheet" href="./core/shell.css">
</head>
<body>
<div id="root"></div>
<script type="module">
  import { boot } from './core/shell.js';
  const id = new URLSearchParams(location.search).get('game') || 'neon-break';
  boot(id, document.getElementById('root')).catch(err => {
    console.error(err);
    document.getElementById('root').innerHTML =
      '<main class="app"><h1>Não foi possível carregar o jogo</h1><p><a href="./index.html">Voltar</a></p></main>';
  });
  if ('serviceWorker' in navigator) {
    // updateViaCache: 'none' garante que a checagem de build novo nunca leia o
    // sw.js do HTTP cache. Aqui não há reload automático: trocar a página no
    // meio de uma partida perderia o progresso — o menu cuida disso.
    window.addEventListener('load', () => {
      navigator.serviceWorker.register('./sw.js', { updateViaCache: 'none' })
        .then(reg => {
          // Empurra o build novo para "activated" (senão ele fica em espera
          // enquanto o app continuar aberto); a página em si não recarrega.
          let tries = 0;
          const promote = () => {
            if (tries++ > 20) return;
            if (reg.waiting) reg.waiting.postMessage({ type: 'SKIP_WAITING' });
            if (reg.waiting || reg.installing) setTimeout(promote, 1200);
          };
          promote();
          reg.addEventListener('updatefound', promote);
          return reg.update().catch(() => {});
        })
        .catch(() => {});
    });
  }
</script>
</body>
</html>
