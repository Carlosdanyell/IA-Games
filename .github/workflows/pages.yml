name: Deploy GitHub Pages

on:
  push:
    branches:
      - main
      - claude/html-game-collision-analysis-l2hl3y
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      # Requer Settings > Pages > Source = "GitHub Actions" (ativação única;
      # o GITHUB_TOKEN não tem permissão para criar o site sozinho).
      - uses: actions/configure-pages@v5
      - name: Upload site
        uses: actions/upload-pages-artifact@v3
        with:
          path: .
      - id: deployment
        uses: actions/deploy-pages@v4
