name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  testes:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          # O teste de VERSION compara com o commit anterior ao push ou com a base do PR.
          fetch-depth: 0
      - uses: actions/setup-node@v7
        with:
          node-version: 24
      - name: Testes
        env:
          BASE_REF: ${{ github.event.pull_request.base.sha || github.event.before }}
        run: node --experimental-vm-modules --test "tests/*.test.mjs"
